[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-access-log-blocker"
version = "1.0.0"
description = "Automated Apache access log monitoring and IP blocking based on configurable request rate and URL patterns."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]